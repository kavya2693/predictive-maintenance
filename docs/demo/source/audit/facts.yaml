# Audit facts for the predictive-maintenance demo video.
# Read by docs/demo/source/tools/build_audit_report.py (paths below are relative to this file).
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
#   cl(policy, crew=6) -> the closed-loop summary row from outputs/results.json (mean of 5 forks)
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).

project:
  name: predictive-maintenance
  title: "predictive-maintenance: demo video audit report"
  repo_url: https://github.com/kavya2693/predictive-maintenance
  repo_dir: ../../../..
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 88.8
  outputs_dir: outputs
  venv_python: .venv/bin/python
  version_packages: [lightgbm, lifelines, pandas, numpy, sklearn]
  regenerate:
    - "make run                                   # data/*.csv + outputs/results.json, closed_loop_runs.csv, work_orders.json (~2 min)"
    - ".venv/bin/python docs/demo/source/tools/export_work_orders.py docs/demo/source/assets/plant_run.json   # ~25 s"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/plant_run.json docs/demo/source/compositions --rows 0,1,2,3,4,5"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/predictive-maintenance-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/predictive-maintenance-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml   # stills, checks, MD/DOCX/PDF"
  seeds: {data_seed: 7, closed_loop_seeds: "101-105 (5 forks)", fork_shown_on_slides_04_06: 101, lightgbm_random_state: 0}
  run_time: "results.json runtime_seconds = 127.3 s (about 2 min) for make run on the author's laptop"

assumptions:
  - id: A-01
    statement: "All data is synthetic: a seeded day-by-day plant model (200 assets, 3 years) generates the sensor history, the maintenance log and the latent lives. The same plant model also runs the closed-loop evaluation, so results describe a plant with these physics, not a given real plant (README 'Known limitations', the biggest gap)."
    source: "src/predictive_maintenance/plant.py; data.py:152-160 (generate, seed 7); config.py:14; README 'The data'"
    figures: [F-03]
    all_figures: true
    edit: ["src/predictive_maintenance/config.py", "src/predictive_maintenance/plant.py"]
    rerun: ["make data", "make run", "export_work_orders.py + inject_sheet.py"]
  - id: A-02
    statement: "Failure precursors: each failure mode drifts the sensors for a mode-specific number of days before the failure (bearing 21 d, fouling 35 d, overheating 4 d, ...); sudden failures give no warning. These lengths are assumptions."
    source: "src/predictive_maintenance/config.py:93-101 (PRECURSOR_DAYS)"
    figures: [F-17, F-34, F-35, F-37, F-53, F-54]
    edit: ["src/predictive_maintenance/config.py:93-101"]
    rerun: ["make data", "make run", "export_work_orders.py + inject_sheet.py"]
  - id: A-03
    statement: "Costs: a planned job costs 1,500 plus one day of downtime; a failure costs its repair (9k pump, 22k compressor, 12k heat exchanger) plus 3-5 days of downtime at 3,000 a day. One downtime cost for every asset."
    source: "src/predictive_maintenance/config.py:32-34, :61-62, :72-73, :83-84"
    figures: [F-28, F-40, F-51, F-52]
    edit: ["src/predictive_maintenance/config.py:32-34 and the AssetType blocks"]
    rerun: ["make run", "export_work_orders.py + inject_sheet.py"]
  - id: A-04
    statement: "Crew budget: 6 planned jobs a week, Monday to Friday, at most ceil(6/5) = 2 a day; an asset serviced in the last 21 days is not offered again."
    source: "src/predictive_maintenance/config.py:106 (crew_jobs_per_week), :20 (COOLDOWN_DAYS); policy.py:144-145 (per_day)"
    figures: [F-04, F-29, F-44, F-45, F-46, F-49, F-51, F-53]
    edit: ["src/predictive_maintenance/config.py:106, :20"]
    rerun: ["make run", "export_work_orders.py + inject_sheet.py"]
  - id: A-05
    statement: "Prediction horizon 14 days, feature window 60 days, baseline = window median excluding the last 14 days."
    source: "src/predictive_maintenance/config.py:18-19; features.py:18 (RECENT = 14)"
    figures: [F-23, F-25, F-34, F-35]
    edit: ["src/predictive_maintenance/config.py:18-19", "src/predictive_maintenance/features.py:18"]
    rerun: ["make run", "export_work_orders.py + inject_sheet.py"]
  - id: A-06
    statement: "Every job is a perfect repair (the asset is as good as new); imperfect repair and infant mortality are not modelled."
    source: "README 'Known limitations'; plant.py (_new_life on service)"
    figures: [F-46, F-49, F-51, F-53]
    edit: ["src/predictive_maintenance/plant.py"]
    rerun: ["make run"]
  - id: A-07
    statement: "Closed-loop evaluation: the plant is replayed to the end of the 2-year training history (2024-12-31), forked with seeds 101-105, and each policy runs 365 days from the same fork with the same random stream. Slides 08-09 show the mean of the 5 forks (called 'runs' on screen); slides 04 and 06 show fork 1 (seed 101)."
    source: "src/predictive_maintenance/cli.py:146-168 (closed_loop); plant.py:281-293 (fork); config.py:108 (eval_seeds); docs/adr/0001-judge-policies-in-closed-loop.md"
    figures: [F-11, F-12, F-13, F-30, F-38, F-39, F-46, F-47, F-49, F-50, F-51, F-52, F-53, F-54, F-55, F-65, F-66, F-67, F-68, F-69, F-70]
    edit: ["src/predictive_maintenance/config.py:108"]
    rerun: ["make run", "export_work_orders.py + inject_sheet.py"]
  - id: A-08
    statement: "Truth for scoring: an alert is a catch when the asset's latent life would have ended within 14 days; the latent failure day comes from the plant model (lives_truth.csv / Plant.latent_remaining) and is never a feature."
    source: "src/predictive_maintenance/simulate.py:31-33 (true_alerts); features.py (latent_labels); data.py:1-9"
    figures: [F-16, F-17, F-37, F-43, F-53, F-65, F-66]
    edit: ["src/predictive_maintenance/simulate.py"]
    rerun: ["make run"]
  - id: A-09
    statement: "Video rounding: uptime to 2 decimals, percentages to whole numbers or 1 decimal as shown, costs in millions to 2 decimals, savings in thousands to 1 decimal, failure probability to 2 decimals on the sheet (3 on the work-order card), failure means to 1 decimal or whole numbers as shown."
    source: "this audit (display convention)"
    figures: [F-07, F-14, F-15, F-16, F-17, F-31, F-35, F-40, F-46, F-47, F-49, F-50, F-51, F-52, F-53, F-54, F-64, F-65, F-66, F-67, F-68]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-10
    statement: "Slide 01 (industries, everyday problems) is general maintenance knowledge used as context; it is not a result of this repo and carries no numbers."
    source: "author's framing; README 'The problem' supports problems 1-3"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]

figures:
  # ---- slide 01
  - {id: F-01, slides: ["01"], label: "Industries that relate: refining & chemicals, water & utilities, power & process plants", shown: "3 industry chips", type: general-knowledge, source: "author's framing", key: "-", formula: "-", manual: "Context statement, not a repo output."}
  - {id: F-02, slides: ["01"], label: "Four everyday problems (calendar jobs open healthy machines; due jobs pushed back; breakdowns between services; sensors logged but not ranked)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem' (problems 1-3)", key: "README lines 10-22", formula: "-",
     check: {expr: "grep('README.md', r'months of life left') and grep('README.md', r'push about a third') and grep('README.md', r'unplanned failures')", fmt: bool}}
  # ---- slide 02
  - {id: F-03, slides: ["02", "05", "08"], label: "Assets in the plant", shown: "200 machines", type: direct, source: "data/assets.csv", key: "row count", formula: "-",
     check: {expr: "len(R('data/assets.csv'))", fmt: "{:d}", expect: "200"}}
  - {id: F-04, slides: ["02", "08"], label: "Crew budget", shown: "About 6 planned jobs a week / crew 6 jobs / week", type: direct, source: "outputs/results.json", key: "crew_jobs_per_week", formula: "-",
     check: {expr: "J('outputs/results.json')['crew_jobs_per_week']", fmt: "{:d}", expect: "6"}}
  - {id: F-05, slides: ["02"], label: "Asset mix", shown: "110 pumps · 40 compressors · 50 heat exchangers", type: direct, source: "data/assets.csv", key: "asset_type counts", formula: "-",
     check: {expr: "(lambda c: f\"{c['pump']} pumps · {c['compressor']} compressors · {c['heat_exchanger']} heat exchangers\")(R('data/assets.csv')['asset_type'].value_counts())", fmt: "{}", expect: "110 pumps · 40 compressors · 50 heat exchangers"}}
  - {id: F-06, slides: ["02", "05"], label: "Daily sensor readings", shown: "219,000 daily sensor readings / .csv.gz · 219,000", type: direct, source: "data/sensor_readings.csv.gz", key: "row count", formula: "-",
     check: {expr: "len(R('data/sensor_readings.csv.gz'))", fmt: "{:,d}", expect: "219,000"}}
  - {id: F-07, slides: ["02"], label: "Breakdowns a year under the old calendar policy (3 history years)", shown: "130–157 breakdowns a year on the calendar", type: derived, source: "data/maintenance_log.csv", key: "kind=corrective per year: 143, 130, 157", formula: "min..max of yearly corrective counts",
     check: {expr: "(lambda s: f'{s.min()}–{s.max()}')(R('data/maintenance_log.csv').query(\"kind == 'corrective'\")['date'].str[:4].value_counts())", fmt: "{}", expect: "130–157"}}
  # ---- slide 03
  - {id: F-08, slides: ["03"], label: "Each flow block maps to code (sensors, service log, risk model, break-even, crew plan, work orders)", shown: "SENSORS · SERVICE LOG · RISK MODEL · WORTH A JOB? · CREW PLAN · WORK ORDERS", type: direct, source: "src/predictive_maintenance/", key: "functions", formula: "-",
     check: {expr: "all(grep('src/predictive_maintenance/' + f, p) for f, p in [('features.py', r'def window_features'), ('features.py', r'def last_service_day'), ('models.py', r'class GBMModel'), ('policy.py', r'saving > 0'), ('policy.py', r'def schedule'), ('workorders.py', r'def build')])", fmt: bool}}
  - {id: F-09, slides: ["03"], label: "Outcome badges: fewer breakdowns, lower cost, higher uptime (model policy vs calendar, crew 6)", shown: "fewer breakdowns / lower cost / higher uptime", type: derived, source: "outputs/results.json closed_loop", key: "gbm-sensors vs fixed-interval at crew 6", formula: "failures, cost_total lower; uptime higher",
     check: {expr: "(lambda g, f: g['failures'] < f['failures'] and g['cost_total'] < f['cost_total'] and g['uptime'] > f['uptime'])(cl('gbm-sensors'), cl('fixed-interval'))", fmt: bool}}
  - {id: F-10, slides: ["03"], label: "Scheduling runs every working day (Mon-Fri)", shown: "EVERY WORKING DAY", type: direct, source: "src/predictive_maintenance/config.py:107", key: "working_days = (0..4)", formula: "-",
     check: {expr: "grep('src/predictive_maintenance/config.py', r'working_days: tuple\\[int, \\.\\.\\.\\] = \\(0, 1, 2, 3, 4\\)')", fmt: bool}}
  # ---- slide 04
