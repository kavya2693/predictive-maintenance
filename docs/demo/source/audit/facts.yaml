# Extra check helpers (Python), available to check expressions.
helpers: |
  import re as _re
  def cl(policy, crew=6):
      return next(r for r in J('outputs/results.json')['closed_loop'] if r['policy'] == policy and r['crew'] == crew)
  def _block(path, name):
      m = _re.search(r"const " + name + r" = (\{.*?\}); /\* " + name + r":END", T(path), _re.S)
      return json.loads(m.group(1))
  def n_features():
      cfg = T('src/predictive_maintenance/config.py')
      sensors = _re.search(r'SENSORS = \((.*?)\)', cfg).group(1).count('"') // 2
      types = len(_re.findall(r'^    AssetType\(', cfg, _re.M))
      feats = T('src/predictive_maintenance/features.py')
      per_sensor = len(_re.search(r'for f in \((.*?)\)', feats).group(1).split(','))
      extra = len(_re.findall(r'^    "(load_m7|load_rel3|days_since_maint)",', feats, _re.M))
      return sensors * per_sensor + extra + types
  def loop_ticks_match():
      loop = _block('demo:compositions/explainer.html', 'LOOP')
      d = R('outputs/closed_loop_runs.csv').query('seed == 101 and crew == 6').set_index('policy')['failures']
      return [len(loop['calendar']), len(loop['alarm']), len(loop['model'])] == [d['fixed-interval'], d['alarm-limits'], d['gbm-sensors']]
  def curves_match():
      run = _block('demo:compositions/s04-running.html', 'RUN')
      d = R('outputs/closed_loop_runs.csv').query('seed == 101 and crew == 6').set_index('policy')['failures']
      order = ['run-to-failure', 'cox-sensors', 'fixed-interval', 'alarm-limits', 'gbm-sensors', 'oracle']
      if any(run['curves'][p][-1] != d[p] for p in order):
          return 'curve mismatch'
      return ' · '.join(str(int(d[p])) for p in order)
  def trace_matches():
      tr = _block('demo:compositions/s04-running.html', 'RUN')['trace']
      r = R('data/sensor_readings.csv.gz').query("asset_id == 'COMP-141' and date >= '2024-11-01' and date <= '2024-12-30'").sort_values('date')
      vals = [None if pd.isna(v) else round(float(v), 3) for v in r['vibration']]
      return tr['asset_id'] == 'COMP-141' and tr['alert_date'] == '2024-12-31' and vals == tr['values'] and len(vals) == 60
  def sheet_rows_match():
      sheet = _block('demo:compositions/value.html', 'SHEET')
      src = J('outputs/work_orders.json')[:6]
      if len(sheet['rows']) != 6:
          return False
      for r, o in zip(sheet['rows'], src):
          if (r['id'], r['asset'], r['p'], r['saving'], r['due'], r['crew'], r['evidence']) != (
              o['work_order_id'], o['asset']['asset_id'], o['risk']['failure_probability'], o['risk']['expected_saving'],
              o['schedule']['due_by'], o['schedule']['crew'], o['evidence'][0]):
              return False
      return True
