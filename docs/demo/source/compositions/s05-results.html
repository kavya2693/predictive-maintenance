<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #results-root { position: absolute; inset: 0; }
        #results-root .eyebrow { color: var(--c-eval); }
        #results-root .cards { position: absolute; left: 120px; top: 290px; width: 1680px; display: flex; gap: 30px; }
        #results-root .card {
          position: relative; flex: 1 1 0; height: 500px; border-radius: 16px; border: 2px solid var(--line);
          background: var(--panel); padding: 44px 34px 36px; display: flex; flex-direction: column; overflow: hidden;
        }
        #results-root .card .bar { position: absolute; left: 0; top: 0; width: 100%; height: 6px; }
        #results-root .card .layer { font-family: var(--mono); font-size: 22px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
        #results-root .card .big {
          margin-top: 18px; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 92px;
          font-weight: 700; letter-spacing: -0.05em; line-height: 1; white-space: nowrap;
        }
        #results-root .card .lab { margin-top: 22px; font-size: 32px; font-weight: 700; line-height: 1.2; color: var(--ink); }
        #results-root .mini { position: relative; margin-top: 26px; width: 100%; height: 12px; border-radius: 6px; background: rgba(178, 191, 204, 0.16); }
        #results-root .mini-fill { position: absolute; left: 0; top: 0; width: 100%; height: 12px; border-radius: 6px; transform-origin: left center; }
        #results-root .card .foot {
          margin-top: auto; padding-top: 18px; border-top: 2px solid var(--line);
          font-family: var(--mono); font-size: 22px; color: var(--ink-soft); white-space: nowrap;
        }
        #results-root .opt .bar, #results-root .opt .mini-fill { background: var(--c-opt); }
        #results-root .opt .big, #results-root .opt .layer { color: var(--c-opt); }
        #results-root .mod .bar, #results-root .mod .mini-fill { background: var(--c-model); }
        #results-root .mod .big, #results-root .mod .layer { color: var(--c-model); }
        #results-root .eva .bar, #results-root .eva .mini-fill { background: var(--c-eval); }
        #results-root .eva .big, #results-root .eva .layer { color: var(--c-eval); }
        #results-root .footnote { position: absolute; left: 120px; top: 840px; font-size: 26px; font-weight: 500; color: var(--ink-soft); }
      </style>
      <div id="results-root" data-composition-id="results" data-width="1920" data-height="1080">
        <div class="scene" id="results-in">
          <div class="eyebrow" data-layout-allow-overlap id="results-eyebrow">08 · Results · simulated year, average of 5 runs</div>
          <div class="scene-title" data-layout-allow-overlap id="results-title">Fewer breakdowns, lower cost, same crew.</div>
          <div class="scene-sub" id="results-sub">The model's job list against calendar maintenance. Higher uptime, fewer breakdowns and lower cost are better.</div>
          <div class="cards">
            <div class="card opt" id="results-c1"><div class="bar"></div><div class="layer">uptime</div>
              <div class="big"><span id="results-v1">99.00</span>%</div><div class="lab">asset uptime, model policy</div>
              <div class="mini"><div class="mini-fill" id="results-m1"></div></div><div class="foot">vs calendar 99.00%</div></div>
            <div class="card opt" id="results-c2"><div class="bar"></div><div class="layer">breakdowns</div>
              <div class="big" id="results-v2">111.2</div><div class="lab">unplanned failures a year</div>
              <div class="mini"><div class="mini-fill" id="results-m2"></div></div><div class="foot">calendar 111.2 → 44.2</div></div>
            <div class="card eva" id="results-c3"><div class="bar"></div><div class="layer">cost</div>
              <div class="big"><span id="results-v3">4.01</span>M</div><div class="lab">maintenance + downtime a year</div>
              <div class="mini"><div class="mini-fill" id="results-m3"></div></div><div class="foot">calendar 4.01M → 2.02M</div></div>
            <div class="card mod" id="results-c4"><div class="bar"></div><div class="layer">model</div>
              <div class="big"><span id="results-v4">0.0</span>%</div><div class="lab">failures caught in time</div>
              <div class="mini"><div class="mini-fill" id="results-m4"></div></div><div class="foot">median warning 7.7 days</div></div>
          </div>
          <div class="footnote" id="results-foot">200 machines · crew of 6 jobs a week · the model beat every other real policy in all 5 runs</div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = 8.8;
          tl.fromTo("#results-in", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
          tl.fromTo("#results-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#results-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
          tl.fromTo("#results-sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);
          const stats = [
            { v: "results-v1", m: "#results-m1", from: 99.0, to: 99.47, d: 2, r0: 0, r: 0.4727 / 0.6560 },
            { v: "results-v2", m: "#results-m2", from: 111.2, to: 44.2, d: 1, r0: 1, r: 44.2 / 111.2 },
            { v: "results-v3", m: "#results-m3", from: 4.01, to: 2.02, d: 2, r0: 1, r: 2.02 / 4.01 },
            { v: "results-v4", m: "#results-m4", from: 0, to: 68.7, d: 1, r0: 0, r: 0.687 },
          ];
          stats.forEach((s, i) => {
            const at = 0.7 + i * 0.16;
            tl.fromTo("#results-c" + (i + 1), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at);
            const o = { v: s.from };
            const el = document.getElementById(s.v);
            tl.to(o, { v: s.to, duration: 1.6, ease: "power3.out", onUpdate: () => { el.textContent = o.v.toFixed(s.d).replace("-", "−"); } }, at + 0.3);
            tl.fromTo(s.m, { scaleX: s.r0 }, { scaleX: s.r, duration: 1.6, ease: "power3.out" }, at + 0.3);
          });
          tl.fromTo("#results-foot", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.8);
          tl.to("#results-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.8); // dip: fully out before the next scene starts
          window.__timelines["results"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
