          const dpath = "M" + pts.map(([d, v]) => X(d).toFixed(1) + " " + Y(v).toFixed(1)).join(" L");
          const line = mk(sa, "path", { d: dpath, fill: "none", stroke: "#b9a2ff", "stroke-width": 4, "stroke-linejoin": "round" });
          const L = Math.ceil(line.getTotalLength ? line.getTotalLength() : 2000);
          line.setAttribute("stroke-dasharray", L + " " + L);
          line.setAttribute("stroke-dashoffset", L);
          const dots = pts.map(([d, v]) => mk(sa, "circle", { cx: X(d), cy: Y(v), r: 4.5, fill: d >= -7 ? "#ff8a73" : "#b9a2ff", opacity: 0 }));
          // alert marker
          const am = mk(sa, "line", { x1: X(0), y1: A.y1 - 20, x2: X(0), y2: A.y0, stroke: "#f2c46d", "stroke-width": 4, opacity: 0 });
          const at = mk(sa, "text", { x: X(0) - 12, y: A.y1 - 30, "text-anchor": "end", class: "ax", opacity: 0, style: "fill:#f2c46d;font-weight:700" });
          at.textContent = "alert · " + TR.alert_date;

          document.getElementById("ra-id").textContent = WO.id;
          document.getElementById("ra-asset").textContent = WO.asset + " · " + WO.loc;
          document.getElementById("ra-ev").textContent = WO.evidence.sensor + " +" + Math.round(WO.evidence.change_vs_baseline_7d * 100) + "%";
          document.getElementById("ra-due").textContent = "P" + WO.priority + " · " + WO.due;
          document.getElementById("ra-crew").textContent = WO.crew;
          document.getElementById("ra-truth").innerHTML = "In the replay its hidden life ended <b>" + WO.truth_days.toFixed(1) + " days later</b> (" + WO.truth_mode + "). The job got there first.";
          document.getElementById("ra-chip").textContent = "+" + Math.round(WO.evidence.change_vs_baseline_7d * 100) + "% vs its baseline";

          tl.fromTo("#ra-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
          tl.fromTo("#ra-panel", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.5);
          tl.fromTo("#ra-svg", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.6);
          tl.fromTo(["#ra-n1", "#ra-n2"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8);
          tl.fromTo(line, { attr: { "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 }, duration: 2.4, ease: "none" }, 0.9);
          dots.forEach((c, i) => tl.fromTo(c, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.1 }, 0.9 + (2.4 * i) / dots.length));
          tl.fromTo([bl, blab], { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.4 }, 1.9);
          tl.fromTo(band, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.4 }, 3.1);
          tl.fromTo("#ra-chip", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.4);
          tl.fromTo([am, at], { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.3 }, 3.7);
          tl.fromTo("#ra-wo", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 3.9);
          ["#ra-k1", "#ra-k2", "#ra-k3", "#ra-k4", "#ra-k5"].forEach((k, i) =>
            tl.fromTo(k, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 4.3 + i * 0.18));
          const pv = { v: 0 }, pEl = document.getElementById("ra-p");
          tl.to(pv, { v: WO.p, duration: 0.9, ease: "power2.out", onUpdate: () => { pEl.textContent = pv.v.toFixed(3); } }, 4.5);
          tl.fromTo("#ra-truth", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.6);
          const P2 = 7.0;
          tl.to("#ra", { opacity: 0, duration: 0.4, ease: "power2.in" }, P2);

          // ================= phase B: cumulative breakdowns over the closed-loop year
          const B = { x0: 220, x1: 1490, y0: 840, y1: 290, ymax: 240 };
          const XB = (d) => B.x0 + (d / 365) * (B.x1 - B.x0);
          const YB = (v) => B.y0 - (v / B.ymax) * (B.y0 - B.y1);
          const sb = document.getElementById("rb-svg");
          mk(sb, "line", { x1: B.x0, y1: B.y0, x2: B.x1, y2: B.y0, stroke: "#24364a", "stroke-width": 2 });
          for (let v = 0; v <= 240; v += 60) {
            mk(sb, "line", { x1: B.x0, y1: YB(v), x2: B.x1, y2: YB(v), stroke: "rgba(127,168,255,0.06)", "stroke-width": 2 });
            const t = mk(sb, "text", { x: B.x0 - 14, y: YB(v) + 7, "text-anchor": "end", class: "ax" });
            t.textContent = v;
          }
          [[0, "Dec 31"], [91, "Apr"], [182, "Jul"], [273, "Oct"], [365, "Dec 30"]].forEach(([d, s]) => {
            const t = mk(sb, "text", { x: XB(d), y: B.y0 + 34, "text-anchor": "middle", class: "ax" });
            t.textContent = s;
          });
          const SER = [
            ["run-to-failure", "run-to-failure", "#8494a6", ""],
            ["cox-sensors", "Cox", "#b9a2ff", ""],
            ["fixed-interval", "calendar", "#7fa8ff", ""],
            ["alarm-limits", "alarm limits", "#f2c46d", ""],
            ["gbm-sensors", "model", "#3fd8a8", ""],
            ["oracle", "oracle", "#eef2f6", "6 6"],
          ];
          const RUNB = 4.6, T0 = P2 + 1.2;
          const labHost = document.getElementById("rb-labels");
          SER.forEach(([key, name, col, dash], i) => {
            const cum = RUN.curves[key];
            const dd = "M" + XB(0) + " " + YB(0) + cum.map((v, d) => " L" + XB(d + 1).toFixed(1) + " " + YB(v).toFixed(1)).join("");
            const p = mk(sb, "path", { d: dd, fill: "none", stroke: col, "stroke-width": key === "gbm-sensors" ? 6 : 4, "stroke-linejoin": "round", opacity: key === "gbm-sensors" ? 1 : 0.85 });
            if (dash) p.setAttribute("stroke-dasharray", dash);
            // reveal left to right with a clip rect so dashes survive
            const cp = mk(sb, "clipPath", { id: "rb-clip" + i });
            const cr = mk(cp, "rect", { x: B.x0 - 10, y: 200, width: 0, height: 700 });
            p.setAttribute("clip-path", "url(#rb-clip" + i + ")");
            tl.fromTo(cr, { attr: { width: 0 } }, { attr: { width: B.x1 - B.x0 + 20 }, duration: RUNB, ease: "none" }, T0);
            const fin = cum[cum.length - 1];
            labHost.insertAdjacentHTML("beforeend", '<div class="endlab" id="rb-l' + i + '" style="left:' + (B.x1 + 22) + "px;top:" + (YB(fin) - 15) + "px;color:" + col + '">' + name + '<span id="rb-v' + i + '">0</span></div>');
            const o = { v: 0 }, el = () => document.getElementById("rb-v" + i);
            tl.to(o, { v: fin, duration: RUNB, ease: "none", onUpdate: () => { const e = el(); if (e) e.textContent = Math.round(o.v); } }, T0);
            tl.fromTo("#rb-l" + i, { opacity: 0 }, { opacity: 1, duration: 0.4 }, T0 + RUNB - 0.2);
          });
          const dv = { v: 0 }, dEl = document.getElementById("rb-dayn");
          tl.to(dv, { v: 365, duration: RUNB, ease: "none", onUpdate: () => { dEl.textContent = Math.round(dv.v); } }, T0);
          const cursor = mk(sb, "line", { x1: B.x0, y1: B.y1 - 20, x2: B.x0, y2: B.y0, stroke: "rgba(238,242,246,0.5)", "stroke-width": 2, opacity: 0 });
          tl.fromTo(cursor, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.2 }, T0);
          tl.fromTo(cursor, { attr: { x1: B.x0, x2: B.x0 } }, { attr: { x1: B.x1, x2: B.x1 }, duration: RUNB, ease: "none" }, T0);
          tl.to(cursor, { attr: { opacity: 0 }, duration: 0.3 }, T0 + RUNB);
          tl.fromTo("#rb", { opacity: 0 }, { opacity: 1, duration: 0.01 }, P2 + 0.39);
          tl.fromTo("#rb-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, P2 + 0.4);
          tl.fromTo("#rb-legend", { opacity: 0 }, { opacity: 1, duration: 0.5 }, P2 + 0.6);
          tl.fromTo(["#rb-panel", "#rb-svg", "#rb-day"], { opacity: 0 }, { opacity: 1, duration: 0.5 }, P2 + 0.5);
          tl.to("#running-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.4);
          window.__timelines["running"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
